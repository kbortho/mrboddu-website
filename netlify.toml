[build]
  publish = "site"

# Old Top Doctors domain (now owned, 23 Nov 2026): one-page site, so every old URL goes to the homepage
[[redirects]]
  from = "https://mrkrishnaboddu.co.uk/*"
  to = "https://www.mrboddu.co.uk/"
  status = 301
  force = true

